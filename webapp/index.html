<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dalgatov.pro</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <!-- Главная -->
  <section id="screen-home" class="screen active">
    <div class="hero">
      <div class="hero-avatar">D</div>
      <h1>Привет, <span id="user-name">гость</span> 👋</h1>
      <p class="hero-subtitle">Dalgatov.pro — AI, контент и продвижение для твоего бизнеса</p>
    </div>
    <div class="quick-cards">
      <button class="quick-card" data-target="services">
        <span class="quick-icon">🛠️</span>
        <span>Услуги</span>
      </button>
      <button class="quick-card" data-target="portfolio">
        <span class="quick-icon">🖼️</span>
        <span>Портфолио</span>
      </button>
      <button class="quick-card" data-target="ai">
        <span class="quick-icon">🤖</span>
        <span>AI-помощник</span>
      </button>
    </div>
  </section>

  <!-- Услуги -->
  <section id="screen-services" class="screen">
    <h2 class="screen-title">Услуги</h2>
    <div id="services-list" class="card-list">
      <div class="loader">Загрузка…</div>
    </div>
  </section>

  <!-- Портфолио -->
  <section id="screen-portfolio" class="screen">
    <h2 class="screen-title">Портфолио</h2>
    <div id="portfolio-list" class="card-list">
      <div class="loader">Загрузка…</div>
    </div>
  </section>

  <!-- AI-помощник -->
  <section id="screen-ai" class="screen">
    <h2 class="screen-title">AI-помощник</h2>
    <div id="ai-chat" class="ai-chat"></div>
    <div class="ai-input-row">
      <input type="text" id="ai-input" placeholder="Задай вопрос...">
      <button id="ai-send" aria-label="Отправить">➤</button>
    </div>
  </section>

  <!-- Заявка -->
  <section id="screen-lead" class="screen">
    <h2 class="screen-title">Оставить заявку</h2>
    <form id="lead-form" class="lead-form">
      <label>Имя
        <input type="text" id="lead-name" required>
      </label>
      <label>Контакт (телефон или @username)
        <input type="text" id="lead-contact" required>
      </label>
      <label>Сообщение
        <textarea id="lead-message" rows="4"></textarea>
      </label>
      <div id="lead-error" class="form-error"></div>
      <button type="submit" class="btn-primary">Отправить заявку</button>
    </form>
    <div id="lead-success" class="lead-success" hidden>
      ✅ Заявка отправлена! Мы свяжемся с вами скоро.
    </div>
  </section>

  <!-- Профиль -->
  <section id="screen-profile" class="screen">
    <h2 class="screen-title">Профиль</h2>
    <div class="profile-card">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <div class="profile-name" id="profile-name">—</div>
      <div class="profile-username" id="profile-username">—</div>
      <div class="profile-id" id="profile-id">—</div>
    </div>
  </section>

</div>

<nav id="bottom-nav">
  <button class="nav-btn active" data-target="home">
    <span class="nav-icon">🏠</span><span>Главная</span>
  </button>
  <button class="nav-btn" data-target="services">
    <span class="nav-icon">🛠️</span><span>Услуги</span>
  </button>
  <button class="nav-btn" data-target="portfolio">
    <span class="nav-icon">🖼️</span><span>Портфолио</span>
  </button>
  <button class="nav-btn" data-target="ai">
    <span class="nav-icon">🤖</span><span>AI</span>
  </button>
  <button class="nav-btn" data-target="profile">
    <span class="nav-icon">👤</span><span>Профиль</span>
  </button>
</nav>

<script src="script.js"></script>
</body>
</html>
